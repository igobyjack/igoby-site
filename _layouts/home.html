<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch (error) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Switch color theme">
    <svg class="theme-toggle__icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/></svg>
    <svg class="theme-toggle__icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A9 9 0 0 1 8.5 3.5a9 9 0 1 0 12 12Z" fill="currentColor"/></svg>
  </button>
  <div class="hero-section">
    <canvas id="simulationCanvas" role="img" aria-label="Interactive three-body gravity simulation. Drag a body to move it."></canvas>
    <div class="simulation-controls" role="group" aria-label="Simulation controls">
      <button id="pause-button" type="button" aria-label="Pause simulation">Pause</button>
      <button id="reset-button" type="button" aria-label="Reset simulation">Reset</button>
    </div>
    <p class="simulation-hint">Drag the bodies · Scroll to explore</p>
    <div class="center-content">
      <h1>Jack Chubick</h1>
      <img src="/assets/images/profile/laserpfp.png" alt="Profile Picture" class="profile-pic">
      <div class="social-links">
        <a href="/projects.html" target="_self">
          <img src="/assets/icons/projects.png" alt="Projects">
        </a>
        <a href="https://github.com/igobyjack" target="_blank" rel="noopener">
          <img src="/assets/icons/github.png" alt="GitHub">
        </a>
        <a href="https://www.linkedin.com/in/jack-chubick-324286251/" target="_blank" rel="noopener">
          <img src="/assets/icons/linkedin.png" alt="LinkedIn">
        </a>
      </div>
    </div>
  </div>
  <script src="/assets/js/threebody.js"></script>
  <div class="main-content">
    {{ content }}
  </div>
  <br>
  <footer class="footer">
    <hr>
    <p>Contact me at jachubick [@] gmail.com</p>
  </footer>

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script src="/assets/js/theme.js"></script>
</body>
</html>
